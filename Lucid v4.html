function buildShareText(entry) {
  const feeling = entry.tertiary ? entry.tertiary.label
    : entry.secondary ? entry.secondary.label
    : entry.core ? entry.core.label : 'a feeling';
  const lines = [];
  lines.push('I felt ' + feeling + ' today.');
  if (entry.core && entry.secondary && entry.tertiary) {
    lines.push(entry.core.label + ' \u2192 ' + entry.secondary.label + ' \u2192 ' + entry.tertiary.label);
  } else if (entry.core && entry.secondary) {
    lines.push(entry.core.label + ' \u2192 ' + entry.secondary.label);
  }
  if (entry.connection) lines.push('Connected to: ' + entry.connection.icon + ' ' + entry.connection.label);
  if (entry.note) lines.push('\n\u201C' + entry.note + '\u201D');
  lines.push('\n\u2014 ' + formatDate(entry.timestamp) + ', ' + formatTime(entry.timestamp));
  lines.push('via Lucid');
  return lines.join('\n');
}
